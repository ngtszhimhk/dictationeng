<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小五英文默書 - Verb Table</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, "微軟正黑體";
            padding: 20px;
            background-color: #f9f9f9;
            color: #333;
        }
        h2 {
            text-align: center;
        }
        .table-container {
            display: flex;
            justify-content: center;
            overflow-x: auto;
        }
        table {
            border-collapse: collapse;
            background-color: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        th, td {
            border: 1px solid #666;
            padding: 10px;
            text-align: center;
            vertical-align: middle;
            font-size: 18px;
        }
        th {
            background-color: #e0e0e0;
        }
        /* 四線譜背景設計 */
        .canvas-wrapper {
            position: relative;
            width: 160px;
            height: 50px;
            margin: 0 auto;
            background-color: #fff;
            background-image: linear-gradient(
                to bottom,
                transparent 13px, #ff9999 14px, /* 第一線 紅色 */
                transparent 15px, transparent 24px, #99ccff 25px, /* 第二線 藍色 */
                transparent 26px, transparent 35px, #99ccff 36px, /* 第三線 藍色 */
                transparent 37px, transparent 46px, #ff9999 47px /* 第四線 紅色 */
            );
            border: 1px solid #ccc;
            border-radius: 4px;
            display: inline-block;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            cursor: crosshair;
            touch-action: none; /* 防止在畫布上滑動時觸發網頁滾動 */
        }
        .correct-ans-col {
            display: none; /* 預設隱藏，批改後顯示 */
            color: #0056b3;
            font-weight: bold;
            background-color: #f0f8ff;
        }
        .mark-icon {
            font-size: 24px;
            font-weight: bold;
            margin-left: 10px;
            vertical-align: middle;
            display: inline-block;
            width: 25px;
        }
        .tick { color: #28a745; }
        .cross { color: #dc3545; }
        
        .controls {
            text-align: center;
            margin: 20px 0;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            margin: 0 5px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            color: white;
            transition: 0.3s;
        }
        #btnBlue { background-color: #007bff; }
        #btnEraser { background-color: #6c757d; }
        #btnGrade { background-color: #28a745; font-weight: bold; }
        #btnClear { background-color: #dc3545; }
        button:hover { opacity: 0.8; }
        button.active { box-shadow: 0 0 0 4px rgba(0,0,0,0.2); transform: scale(1.05); }

        #feedback-section {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }
        #loading {
            display: none;
            text-align: center;
            font-size: 18px;
            color: #d39e00;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h2>Part A: Verb table (regular / irregular verbs) (10%)</h2>

    <div class="table-container">
        <table id="verbTable">
            <thead>
                <tr>
                    <th>Present tense</th>
                    <th>Present Perfect<br>(has/have)</th>
                    <th class="correct-ans-col">Correct Answer</th>
                    <th>Present tense</th>
                    <th>Present Perfect<br>(has/have)</th>
                    <th class="correct-ans-col">Correct Answer</th>
                </tr>
            </thead>
            <tbody>
                </tbody>
        </table>
    </div>

    <div class="controls">
        <button id="btnBlue" class="active">✏️ 藍筆</button>
        <button id="btnEraser">🧽 膠擦</button>
        <button id="btnGrade">🤖 AI 自動批改</button>
        <button id="btnClear">🗑️ 清屏重默</button>
    </div>

    <div id="loading">⏳ AI 正在努力辨識你的手寫字中，請稍候約 10-20 秒...</div>
    <div id="feedback-section"></div>

    <script>
        // 題目資料 (注意：圖片中第8題為take，下方原圖錯標為8. get，這裡修正為9. get)
        const verbsData = [
            { tense: "1. ask", perfect: "asked" },
            { tense: "6. eat", perfect: "eaten" },
            { tense: "2. look", perfect: "looked" },
            { tense: "7. ride", perfect: "ridden" },
            { tense: "3. shout", perfect: "shouted" },
            { tense: "8. take", perfect: "taken" },
            { tense: "4. tidy", perfect: "tidied" },
            { tense: "9. get", perfect: "got" },
            { tense: "5. study", perfect: "studied" },
            { tense: "10. sit", perfect: "sat" }
        ];

        let canvases = [];
        let contexts = [];
        let currentTool = 'pen'; 

        // 建立表格
        function buildTable() {
            const tbody = document.querySelector("#verbTable tbody");
            for (let i = 0; i < 5; i++) {
                const tr = document.createElement("tr");
                
                // 左半部 (1-5)
                const leftItem = verbsData[i * 2];
                tr.appendChild(createCell(leftItem.tense));
                tr.appendChild(createCanvasCell(i * 2));
                tr.appendChild(createAnswerCell(leftItem.perfect, i * 2));

                // 右半部 (6-10)
                const rightItem = verbsData[i * 2 + 1];
                tr.appendChild(createCell(rightItem.tense));
                tr.appendChild(createCanvasCell(i * 2 + 1));
                tr.appendChild(createAnswerCell(rightItem.perfect, i * 2 + 1));

                tbody.appendChild(tr);
            }
            initCanvases();
        }

        function createCell(text) {
            const td = document.createElement("td");
            td.innerText = text;
            return td;
        }

        function createCanvasCell(index) {
            const td = document.createElement("td");
            td.innerHTML = `
                <div class="canvas-wrapper">
                    <canvas id="canvas${index}" width="160" height="50"></canvas>
                </div>
                <span class="mark-icon" id="mark${index}"></span>
            `;
            return td;
        }

        function createAnswerCell(answer, index) {
            const td = document.createElement("td");
            td.className = "correct-ans-col ans-cell";
            td.id = `ans${index}`;
            td.innerText = answer;
            return td;
        }

        // 初始化畫布與繪圖事件
        function initCanvases() {
            for (let i = 0; i < 10; i++) {
                const canvas = document.getElementById(`canvas${i}`);
                const ctx = canvas.getContext("2d", { willReadFrequently: true });
                // 設定預設為藍筆，筆劃較幼
                ctx.lineWidth = 2.5; 
                ctx.lineCap = "round";
                ctx.lineJoin = "round";
                ctx.strokeStyle = "#0000ff";
                
                canvases.push(canvas);
                contexts.push(ctx);

                let isDrawing = false;
                let lastX = 0;
                let lastY = 0;

                function getPos(e) {
                    const rect = canvas.getBoundingClientRect();
                    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                    return { x: clientX - rect.left, y: clientY - rect.top };
                }

                function startDrawing(e) {
                    isDrawing = true;
                    const pos = getPos(e);
                    lastX = pos.x; lastY = pos.y;
                    ctx.beginPath();
                    ctx.moveTo(lastX, lastY);
                }

                function draw(e) {
                    if (!isDrawing) return;
                    e.preventDefault(); // 防止手機滑動
                    const pos = getPos(e);
                    
                    if (currentTool === 'eraser') {
                        ctx.globalCompositeOperation = "destination-out";
                        ctx.lineWidth = 15; // 膠擦大一點
                    } else {
                        ctx.globalCompositeOperation = "source-over";
                        ctx.strokeStyle = "#0000ff";
                        ctx.lineWidth = 2.5;
                    }

                    ctx.lineTo(pos.x, pos.y);
                    ctx.stroke();
                    lastX = pos.x; lastY = pos.y;
                }

                function stopDrawing() {
                    isDrawing = false;
                }

                // 滑鼠事件
                canvas.addEventListener('mousedown', startDrawing);
                canvas.addEventListener('mousemove', draw);
                canvas.addEventListener('mouseup', stopDrawing);
                canvas.addEventListener('mouseout', stopDrawing);

                // 觸控事件 (平板/手機)
                canvas.addEventListener('touchstart', startDrawing);
                canvas.addEventListener('touchmove', draw, {passive: false});
                canvas.addEventListener('touchend', stopDrawing);
            }
        }

        // 按鈕功能綁定
        document.getElementById('btnBlue').addEventListener('click', function() {
            currentTool = 'pen';
            this.classList.add('active');
            document.getElementById('btnEraser').classList.remove('active');
        });

        document.getElementById('btnEraser').addEventListener('click', function() {
            currentTool = 'eraser';
            this.classList.add('active');
            document.getElementById('btnBlue').classList.remove('active');
        });

        document.getElementById('btnClear').addEventListener('click', function() {
            if(confirm("確定要清除所有內容重新默寫嗎？")) {
                contexts.forEach(ctx => {
                    ctx.clearRect(0, 0, 160, 50);
                });
                // 隱藏答案與分數
                document.querySelectorAll('.correct-ans-col').forEach(col => col.style.display = 'none');
                for(let i=0; i<10; i++) {
                    document.getElementById(`mark${i}`).innerHTML = '';
                }
                document.getElementById('feedback-section').style.display = 'none';
            }
        });

        // AI 自動批改邏輯
        document.getElementById('btnGrade').addEventListener('click', async function() {
            const loading = document.getElementById('loading');
            loading.style.display = 'block';
            document.getElementById('feedback-section').style.display = 'none';
            
            // 顯示正確答案欄位
            document.querySelectorAll('.correct-ans-col').forEach(col => {
                col.style.display = 'table-cell';
            });

            let score = 0;
            // 載入 Tesseract Worker (英文辨識)
            const worker = await Tesseract.createWorker('eng');
            
            for (let i = 0; i < 10; i++) {
                const canvas = canvases[i];
                const expectedAnswer = verbsData[i].perfect;
                
                // 檢查畫布是否空白 (簡單判斷)
                const blank = isCanvasBlank(canvas);
                let recognizedText = "";

                if (!blank) {
                    // 使用 AI 辨識畫布上的圖像
                    const { data: { text } } = await worker.recognize(canvas);
                    // 移除多餘空白與標點，保留大小寫字母
                    recognizedText = text.trim().replace(/[^a-zA-Z]/g, ''); 
                }

                const markIcon = document.getElementById(`mark${i}`);
                
                // 嚴格對比：完全相等（包括大小寫）才給分
                if (!blank && recognizedText === expectedAnswer) {
                    score++;
                    markIcon.innerHTML = '✔';
                    markIcon.className = 'mark-icon tick';
                } else {
                    markIcon.innerHTML = '✘';
                    markIcon.className = 'mark-icon cross';
                    // 開發者可於 Console 觀看 AI 辨識出的文字與正確答案的差距
                    console.log(`題號 ${verbsData[i].tense}: 預期[${expectedAnswer}], AI辨識為[${recognizedText}]`);
                }
            }
            
            await worker.terminate();
            loading.style.display = 'none';

            // 顯示分數與評語
            const feedback = document.getElementById('feedback-section');
            feedback.style.display = 'block';
            
            let comment = "";
            if (score === 10) {
                comment = "🏆 太棒了！完美滿分，繼續保持！";
                feedback.style.backgroundColor = "#d4edda";
                feedback.style.color = "#155724";
            } else if (score >= 7) {
                comment = "🌟 表現得很好！看看錯在哪裡，下次一定能拿滿分！";
                feedback.style.backgroundColor = "#cce5ff";
                feedback.style.color = "#004085";
            } else if (score >= 4) {
                comment = "👍 繼續努力！留意大小寫和不規則動詞的串法喔。";
                feedback.style.backgroundColor = "#fff3cd";
                feedback.style.color = "#856404";
            } else {
                comment = "💪 不要灰心，多多溫習，你可以的！";
                feedback.style.backgroundColor = "#f8d7da";
                feedback.style.color = "#721c24";
            }

            feedback.innerHTML = `本次得分：${score} / 10 分<br><br>${comment}`;
        });

        // 輔助功能：判斷畫布是否全白 (避免把空白格拿去 AI 辨識浪費時間)
        function isCanvasBlank(canvas) {
            const blank = document.createElement('canvas');
            blank.width = canvas.width;
            blank.height = canvas.height;
            return canvas.toDataURL() === blank.toDataURL();
        }

        // 網頁載入後生成表格
        window.onload = buildTable;

    </script>
</body>
</html>
