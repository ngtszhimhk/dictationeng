<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小五英文默書助手 - Part A</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    
    <style>
        :root {
            --primary-color: #4CAF50;
            --secondary-color: #2196F3;
            --bg-color: #f4f7f6;
        }
        body {
            font-family: 'Comic Sans MS', 'PingFang HK', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: #333;
        }
        h1, h2 {
            text-align: center;
            color: #2c3e50;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        th, td {
            border: 2px solid #ddd;
            padding: 12px;
            text-align: left;
            font-size: 18px;
        }
        th {
            background-color: #ffeaa7;
            text-align: center;
        }
        input[type="text"] {
            width: 80%;
            padding: 8px;
            font-size: 18px;
            border: 2px dashed #aaa;
            border-radius: 5px;
            text-align: center;
        }
        input.correct {
            background-color: #c8e6c9;
            border-color: #4CAF50;
        }
        input.incorrect {
            background-color: #ffcdd2;
            border-color: #f44336;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 5px;
            font-weight: bold;
            transition: transform 0.1s;
        }
        button:active {
            transform: scale(0.95);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .btn-check { background-color: var(--primary-color); color: white; }
        .btn-reset { background-color: #ff9800; color: white; }
        .btn-speak { 
            background: none; 
            border: none; 
            font-size: 20px; 
            cursor: pointer; 
            padding: 0; 
            margin-left: 5px;
        }
