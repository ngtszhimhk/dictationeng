<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小五英文默書助手 - Part A</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    
    <style>
        :root {
            --primary-color: #4CAF50;
            --secondary-color: #2196F3;
            --bg-color: #f4f7f6;
        }
        body {
            font-family: 'Comic Sans MS', 'PingFang HK', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: #333;
        }
        h1, h2 {
            text-align: center;
            color: #2c3e50;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        th, td {
            border: 2px solid #ddd;
            padding: 12px;
            text-align: center;
            font-size: 18px;
        }
        th {
            background-color: #ffeaa7;
        }
        input[type="text"] {
            width: 80%;
            padding: 8px;
            font-size: 18px;
            border: 2px dashed #aaa;
            border-radius: 5px;
            text-align: center;
        }
        input.correct {
            background-color: #c8e6c9;
            border-color: #4CAF50;
        }
        input.incorrect {
            background-color: #ffcdd2;
            border-color: #f44336;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 5px;
            font-weight: bold;
            transition: transform 0.1s;
        }
        button:active {
            transform: scale(0.95);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .btn-check { background-color: var(--primary-color); color: white; }
        .btn-reset { background-color: #ff9800; color: white; }
        .btn-upload { background-color: var(--secondary-color); color: white; }
        .btn-download { background-color: #8e44ad; color: white; }
        .btn-speak { 
            background: none; 
            border: none; 
            font-size: 20px; 
            cursor: pointer; 
            padding: 0; 
            margin-left: 5px;
        }
        .btn-speak:hover { transform: scale(1.2); }
        
        .score-board {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            color: #e74c3c;
            margin: 10px 0;
            min-height: 35px;
        }

        /* Canvas Styles */
        .canvas-container {
            position: relative;
            text-align: center;
            margin: 10px 0 20px 0;
            overflow-x: auto;
        }
        canvas {
            border: 2px solid #555;
            border-radius: 10px;
            background-image: repeating-linear-gradient(white, white 39px, #81ecec 40px);
            cursor: crosshair;
            touch-action: none; 
        }
        
        /* 文具列 Styles */
        .toolbar {
            text-align: center;
            margin-bottom: 10px;
            background: #eee;
            padding: 10px;
            border-radius: 10px;
            display: inline-block;
        }
        .tool-btn {
            background-color: white;
            color: #333;
            border: 2px solid #ccc;
            padding: 8px 15px;
            border-radius: 20px;
        }
        .tool-btn.active {
            background-color: #ffeaa7;
            border-color: #f39c12;
            box-shadow: 0 0 5px rgba(0,0,0,0.2);
        }

        .mock-result {
            display: none;
            background: #e8f8f5;
            border-left: 5px solid #1abc9c;
            padding: 15px;
            margin-top: 15px;
            border-radius: 5px;
        }

        /* 為了截圖好看，設定一個專屬的截圖區域容器 */
        #screenshotArea {
            background: white;
            padding: 10px;
            border-radius: 10px;
            margin-top: 15px;
        }

        #imagePreview {
            max-width: 100%;
            margin-top: 10px;
            border-radius: 10px;
            display: none;
            border: 2px solid #ccc;
        }
        
        .loading {
            color: var(--secondary-color);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>📝 小五英文默書助手 (Regular / Irregular Verbs)</h1>

    <div class="container" id="part1">
        <h2>Part A: 請填上正確的 Present Perfect 動詞 (10分)</h2>
        <p style="text-align: center; color: #e74c3c; font-size: 14px;">⚠️ 注意：必須完全寫對大小寫！例如答案是 asked，寫成 Asked 將會扣分。</p>
        <table id="dictationTable">
            <thead>
                <tr>
                    <th>Present Tense</th>
                    <th>Present Perfect (答案)</th>
                    <th>Present Tense</th>
                    <th>Present Perfect (答案)</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                </tbody>
        </table>
        <div style="text-align: center;">
            <button class="btn-check" onclick="checkTable()">✔️ 自動批改</button>
            <button class="btn-reset" onclick="resetTable()">🔄 重置表格</button>
        </div>
        <div class="score-board" id="tableScore"></div>
    </div>

    <div class="container" id="part2">
        <h2>Part A: Apple Pencil 單行簿畫布版</h2>
        <p>在下方選擇文具，並在畫布的空白處寫上你的答案吧！</p>
        
        <div style="text-align: center;">
            <div class="toolbar">
                <button class="tool-btn active" id="tool-black" onclick="setTool('black')">🖊️ 黑筆</button>
                <button class="tool-btn" id="tool-blue" onclick="setTool('blue')">🖊️ 藍筆</button>
                <button class="tool-btn" id="tool-eraser" onclick="setTool('eraser')">🧽 膠擦</button>
            </div>
        </div>

        <div class="canvas-container">
            <canvas id="dictationCanvas" width="700" height="440"></canvas>
        </div>
        <div style="text-align: center;">
            <button class="btn-reset" onclick="clearCanvas()">🧹 清除整個畫布</button>
            <button class="btn-check" id="btnCanvasOCR" onclick="checkCanvasOCR()">🤖 畫布真實AI辨識</button>
        </div>
        <div class="mock-result" id="canvasResult"></div>
    </div>

    <div class="container" id="part3">
        <h2>Part A: 紙本默書拍照上傳</h2>
        <p>如果你在自己的紙上完成了默書，請點擊下方按鈕拍照或上傳圖片：</p>
        <div style="text-align: center;">
            <input type="file" id="fileInput" accept="image/*" capture="environment" style="display: none;" onchange="previewImage(event)">
            <button class="btn-upload" onclick="document.getElementById('fileInput').click()">📸 拍照 / 上傳默書紙</button>
            <button class="btn-check" id="btnUploadOCR" onclick="checkUploadOCR()">🤖 圖片真實AI辨識</button>
        </div>
        
        <div id="screenshotArea">
            <div style="text-align: center;">
                <img id="imagePreview" alt="你的默書紙">
            </div>
            <div class="mock-result" id="uploadResult"></div>
        </div>

        <div style="text-align: center; margin-top: 15px;">
            <button class="btn-download" id="btnScreenshot" style="display: none;" onclick="takeScreenshot()">💾 下載這份成績單 (截圖)</button>
        </div>
    </div>

    <script>
        // 依照圖片更新的默書範圍
        const wordList = [
            { present: 'ask', perfect: 'asked' },
            { present: 'look', perfect: 'looked' },
            { present: 'shout', perfect: 'shouted' },
            { present: 'tidy', perfect: 'tidied' },
            { present: 'study', perfect: 'studied' },
            { present: 'eat', perfect: 'eaten' },
            { present: 'ride', perfect: 'ridden' },
            { present: 'take', perfect: 'taken' },
            { present: 'get', perfect: 'got' },
            { present: 'sit', perfect: 'sat' }
        ];

        // --- 英式英語發音功能 ---
        function speakWord(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-GB'; 
                utterance.rate = 0.85;    
                window.speechSynthesis.speak(utterance);
            } else {
                alert("你的瀏覽器不支援發音功能喔！");
            }
        }

        // --- 第一部分：表格邏輯 ---
        function initTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            for (let i = 0; i < wordList.length; i += 2) {
                const w1 = wordList[i];
                const w2 = wordList[i + 1];
                tbody.innerHTML += `
                    <tr>
                        <td>
                            ${i+1}. ${w1.present} 
                            <button class="btn-speak" title="聆聽發音" onclick="speakWord('${w1.present}')">🔊</button>
                        </td>
                        <td><input type="text" id="ans_${i}" autocomplete="off"></td>
                        <td>
                            ${i+2}. ${w2.present}
                            <button class="btn-speak" title="聆聽發音" onclick="speakWord('${w2.present}')">🔊</button>
                        </td>
                        <td><input type="text" id="ans_${i+1}" autocomplete="off"></td>
                    </tr>
                `;
            }
        }

        function checkTable() {
            let score = 0;
            for (let i = 0; i < wordList.length; i++) {
                const inputElement = document.getElementById(`ans_${i}`);
                const userAnswer = inputElement.value.trim();
                const correctAnswer = wordList[i].perfect;

                inputElement.classList.remove('correct', 'incorrect');

                if (userAnswer === correctAnswer) {
                    inputElement.classList.add('correct');
                    score++;
                } else {
                    inputElement.classList.add('incorrect');
                    inputElement.value = `${userAnswer} (✗ ${correctAnswer})`;
                }
            }
            document.getElementById('tableScore').innerText = `得分： ${score} / 10`;
        }

        function resetTable() {
            for (let i = 0; i < wordList.length; i++) {
                const inputElement = document.getElementById(`ans_${i}`);
                inputElement.value = '';
                inputElement.classList.remove('correct', 'incorrect');
            }
            document.getElementById('tableScore').innerText = '';
        }

        // --- 第二部分：畫布與文具邏輯 ---
        const canvas = document.getElementById('dictationCanvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;
        let currentTool = 'black'; 

        function setTool(tool) {
            currentTool = tool;
            document.getElementById('tool-black').classList.remove('active');
            document.getElementById('tool-blue').classList.remove('active');
            document.getElementById('tool-eraser').classList.remove('active');
            document.getElementById(`tool-${tool}`).classList.add('active');
        }

        function initCanvasText() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.globalCompositeOperation = 'source-over';
            ctx.font = '20px Comic Sans MS';
            ctx.fillStyle = '#333';
            
            let leftColX = 30, rightColX = 380;
            for (let i = 0; i < 5; i++) {
                let y = 65 + (i * 80); 
                ctx.fillText(`${i+1}. ${wordList[i].present} ➔ `, leftColX, y);
                ctx.fillText(`${i+6}. ${wordList[i+5].present} ➔ `, rightColX, y);
            }
        }

        function startPosition(e) { isDrawing = true; draw(e); }
        function endPosition() { isDrawing = false; ctx.beginPath(); }
        
        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            let clientX = e.clientX || (e.touches && e.touches[0].clientX);
            let clientY = e.clientY || (e.touches && e.touches[0].clientY);
            const x = clientX - rect.left;
            const y = clientY - rect.top;

            ctx.lineCap = 'round';

            if (currentTool === 'eraser') {
                ctx.globalCompositeOperation = 'destination-out';
                ctx.lineWidth = 20; 
                ctx.strokeStyle = 'rgba(0,0,0,1)'; 
            } else {
                ctx.globalCompositeOperation = 'source-over';
                ctx.lineWidth = 3;
                if (currentTool === 'black') {
                    ctx.strokeStyle = '#2c3e50'; 
                } else if (currentTool === 'blue') {
                    ctx.strokeStyle = '#2980b9'; 
                }
            }
            
            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y);
        }

        canvas.addEventListener('mousedown', startPosition);
        canvas.addEventListener('mouseup', endPosition);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('touchstart', startPosition, {passive: false});
        canvas.addEventListener('touchend', endPosition);
        canvas.addEventListener('touchmove', draw, {passive: false});

        function clearCanvas() {
            initCanvasText();
            document.getElementById('canvasResult').style.display = 'none';
            setTool('black');
        }

        async function checkCanvasOCR() {
            const resultBox = document.getElementById('canvasResult');
            const btn = document.getElementById('btnCanvasOCR');
            
            resultBox.style.display = 'block';
            resultBox.innerHTML = '<p class="loading">⏳ AI 正在努力閱讀你的筆跡中，請稍候...</p>';
            btn.disabled = true;

            try {
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = canvas.width;
                tempCanvas.height = canvas.height;
                const tempCtx = tempCanvas.getContext('2d');
                tempCtx.fillStyle = '#ffffff';
                tempCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
                tempCtx.drawImage(canvas, 0, 0);

                const dataUrl = tempCanvas.toDataURL("image/png");
                const { data: { text } } = await Tesseract.recognize(dataUrl, 'eng');
                analyzeOCRText(text, resultBox);
            } catch (error) {
                resultBox.innerHTML = `<p style="color:red;">❌ 辨識發生錯誤：${error.message}</p>`;
            } finally {
                btn.disabled = false;
            }
        }

        // --- 第三部分：上傳與截圖邏輯 ---
        function previewImage(event) {
            const reader = new FileReader();
            reader.onload = function() {
                const output = document.getElementById('imagePreview');
                output.src = reader.result;
                output.style.display = 'inline-block';
                document.getElementById('uploadResult').style.display = 'none';
                document.getElementById('btnScreenshot').style.display = 'none'; // 隱藏截圖按鈕
            }
            if(event.target.files[0]) {
                reader.readAsDataURL(event.target.files[0]);
            }
        }

        async function checkUploadOCR() {
            const img = document.getElementById('imagePreview');
            const resultBox = document.getElementById('uploadResult');
            const btn = document.getElementById('btnUploadOCR');
            const screenshotBtn = document.getElementById('btnScreenshot');

            if(img.style.display === 'none' || !img.src) {
                alert("請先拍照或上傳默書紙圖片喔！");
                return;
            }

            resultBox.style.display = 'block';
            resultBox.innerHTML = '<p class="loading">⏳ AI 正在分析你上傳的圖片，請稍候...</p>';
            btn.disabled = true;
            screenshotBtn.style.display = 'none';

            try {
                const { data: { text } } = await Tesseract.recognize(img.src, 'eng');
                analyzeOCRText(text, resultBox);
                
                // 辨識完成後，顯示截圖按鈕
                screenshotBtn.style.display = 'inline-block';
            } catch (error) {
                resultBox.innerHTML = `<p style="color:red;">❌ 辨識發生錯誤：${error.message}</p>`;
            } finally {
                btn.disabled = false;
            }
        }

        // 截圖下載功能 (使用 html2canvas)
        function takeScreenshot() {
            const element = document.getElementById('screenshotArea');
            const btn = document.getElementById('btnScreenshot');
            const originalText = btn.innerText;
            
            btn.innerText = '📸 正在製作截圖...';
            btn.disabled = true;

            html2canvas(element, { 
                backgroundColor: '#ffffff',
                scale: 2 // 提高截圖畫質
            }).then(canvas => {
                // 將 Canvas 轉換成圖片網址並觸發下載
                const link = document.createElement('a');
                link.download = '默書成績單.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
                
                btn.innerText = originalText;
                btn.disabled = false;
            }).catch(err => {
                alert("截圖發生錯誤：" + err);
                btn.innerText = originalText;
                btn.disabled = false;
            });
        }

        // --- 共用的 AI 辨識結果分析函數 ---
        function analyzeOCRText(recognizedText, container) {
            let score = 0;
            let feedbackHTML = '<h3>📝 AI 批改結果：</h3>';
            
            let foundWords = [];
            let missedWords = [];

            wordList.forEach(word => {
                const regex = new RegExp(`\\b${word.perfect}\\b`);
                if (regex.test(recognizedText)) {
                    score++;
                    foundWords.push(word.perfect);
                } else {
                    missedWords.push(word.perfect);
                }
            });

            feedbackHTML += `<p style="font-size: 1.2em;"><strong>🌟 得分： ${score} / 10</strong></p>`;
            
            if (foundWords.length > 0) {
                feedbackHTML += `<p style="color: #27ae60;">✅ <b>正確辨識的字：</b><br>${foundWords.join(', ')}</p>`;
            }
            if (missedWords.length > 0) {
                feedbackHTML += `<p style="color: #c0392b;">❌ <b>寫錯 / 找不到的字：</b><br>${missedWords.join(', ')}</p>`;
            }

            feedbackHTML += `
                <hr>
                <details>
                    <summary style="cursor:pointer; color:gray;">🔍 點此查看 AI 實際讀取到的亂碼</summary>
                    <pre style="background:#eee; padding:10px; border-radius:5px; white-space: pre-wrap; font-size: 12px;">${recognizedText}</pre>
                </details>
            `;

            container.innerHTML = feedbackHTML;
        }

        window.onload = () => {
            initTable();
            initCanvasText();
        };
    </script>
</body>
</html>
