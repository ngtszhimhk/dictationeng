<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小五英文默書助手 - Part A</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    
    <style>
        :root {
            --primary-color: #4CAF50;
            --secondary-color: #2196F3;
            --bg-color: #f4f7f6;
        }
        body {
            font-family: 'Comic Sans MS', 'PingFang HK', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: #333;
        }
        h1, h2 {
            text-align: center;
            color: #2c3e50;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        th, td {
            border: 2px solid #ddd;
            padding: 12px;
            text-align: left;
            font-size: 18px;
        }
        th {
            background-color: #ffeaa7;
            text-align: center;
        }
        input[type="text"] {
            width: 80%;
            padding: 8px;
            font-size: 18px;
            border: 2px dashed #aaa;
            border-radius: 5px;
            text-align: center;
        }
        input.correct {
            background-color: #c8e6c9;
            border-color: #4CAF50;
        }
        input.incorrect {
            background-color: #ffcdd2;
            border-color: #f44336;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 5px;
            font-weight: bold;
            transition: transform 0.1s;
        }
        button:active {
            transform: scale(0.95);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .btn-check { background-color: var(--primary-color); color: white; }
        .btn-reset { background-color: #ff9800; color: white; }
        .btn-speak { 
            background: none; 
            border: none; 
            font-size: 20px; 
            cursor: pointer; 
            padding: 0; 
            margin-left: 5px;
        }
        .btn-speak:hover { transform: scale(1.2); }
        
        .score-board {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            color: #e74c3c;
            margin: 10px 0;
            min-height: 35px;
        }

        /* 雙層畫布系統 Styles */
        .canvas-wrapper {
            position: relative;
            width: 100%;
            max-width: 700px;
            height: 440px;
            margin: 10px auto 20px auto;
        }
        .canvas-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 2px solid #555;
            border-radius: 10px;
        }
        #textCanvas {
            z-index: 1; 
            background-image: repeating-linear-gradient(white, white 39px, #81ecec 40px);
        }
        #dictationCanvas {
            z-index: 2; 
            background-color: transparent;
            cursor: crosshair;
            touch-action: none; 
        }
        
        /* 文具列 Styles */
        .toolbar {
            text-align: center;
            margin-bottom: 10px;
            background: #eee;
            padding: 10px;
            border-radius: 10px;
            display: inline-block;
        }
        .tool-btn {
            background-color: white;
            color: #333;
            border: 2px solid #ccc;
            padding: 8px 15px;
            border-radius: 20px;
        }
        .tool-btn.active {
            background-color: #ffeaa7;
            border-color: #f39c12;
            box-shadow: 0 0 5px rgba(0,0,0,0.2);
        }

        .mock-result {
            display: none;
            background: #e8f8f5;
            border-left: 5px solid #1abc9c;
            padding: 15px;
            margin-top: 15px;
            border-radius: 5px;
        }
        
        .loading {
            color: var(--secondary-color);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>📝 小五英文默書助手 (Regular / Irregular Verbs)</h1>

    <div class="container" id="part1">
        <h2>Part A: 請填上正確的 Present Perfect 動詞 (10分)</h2>
        <p style="text-align: center; color: #e74c3c; font-size: 14px;">⚠️ 注意：必須完全寫對大小寫！例如答案是 asked，寫成 Asked 將會扣分。</p>
        <table id="dictationTable">
            <thead>
                <tr>
                    <th>Present Tense</th>
                    <th>Present Perfect (答案)</th>
                    <th>Present Tense</th>
                    <th>Present Perfect (答案)</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
        <div style="text-align: center;">
            <button class="btn-check" onclick="checkTable()">✔️ 自動批改</button>
            <button class="btn-reset" onclick="resetTable()">🔄 重置表格</button>
        </div>
        <div class="score-board" id="tableScore"></div>
    </div>

    <div class="container" id="part2">
        <h2>Part A: Apple Pencil 單行簿畫布版</h2>
        <p>在下方選擇文具，並在空白處寫出對應的字母吧！</p>
        
        <div style="text-align: center;">
            <div class="toolbar">
                <button class="tool-btn active" id="tool-blue" onclick="setTool('blue')">🖊️ 藍筆</button>
                <button class="tool-btn" id="tool-eraser" onclick="setTool('eraser')">🧽 膠擦</button>
            </div>
        </div>

        <div class="canvas-wrapper">
            <canvas id="textCanvas" class="canvas-layer" width="700" height="440"></canvas>
            <canvas id="dictationCanvas" class="canvas-layer" width="700" height="440"></canvas>
        </div>
        <div style="text-align: center;">
            <button class="btn-reset" onclick="clearDrawCanvas()">🔄 重默</button>
            <button class="btn-check" id="btnCanvasOCR" onclick="checkCanvasOCR()">🤖 畫布真實AI批改</button>
        </div>
        <div class="mock-result" id="canvasResult"></div>
    </div>

    <script>
        const wordList = [
            { present: 'ask', perfect: 'asked' },
            { present: 'look', perfect: 'looked' },
            { present: 'shout', perfect: 'shouted' },
            { present: 'tidy', perfect: 'tidied' },
            { present: 'study', perfect: 'studied' },
            { present: 'eat', perfect: 'eaten' },
            { present: 'ride', perfect: 'ridden' },
            { present: 'take', perfect: 'taken' },
            { present: 'get', perfect: 'got' },
            { present: 'sit', perfect: 'sat' }
        ];

        const ignoreWordsList = ['part', 'verb', 'table', 'regular', 'irregular', 'verbs', 'present', 'tense', 'perfect', 'has', 'have'];
        wordList.forEach(w => ignoreWordsList.push(w.present.toLowerCase()));

        function speakWord(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-GB'; 
                utterance.rate = 0.85;    
                window.speechSynthesis.speak(utterance);
            }
        }

        // --- 表格區塊 ---
        function initTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            for (let i = 0; i < 5; i++) {
                const wLeft = wordList[i], wRight = wordList[i + 5]; 
                tbody.innerHTML += `
                    <tr>
                        <td>${i + 1}. ${wLeft.present} <button class="btn-speak" onclick="speakWord('${wLeft.present}')">🔊</button></td>
                        <td style="text-align: center;"><input type="text" id="ans_${i}" autocomplete="off"></td>
                        <td>${i + 6}. ${wRight.present} <button class="btn-speak" onclick="speakWord('${wRight.present}')">🔊</button></td>
                        <td style="text-align: center;"><input type="text" id="ans_${i + 5}" autocomplete="off"></td>
                    </tr>`;
            }
        }

        function checkTable() {
            let score = 0;
            for (let i = 0; i < wordList.length; i++) {
                const inputElement = document.getElementById(`ans_${i}`);
                const userAnswer = inputElement.value.trim();
                const correctAnswer = wordList[i].perfect;
                inputElement.classList.remove('correct', 'incorrect');
                if (userAnswer === correctAnswer) {
                    inputElement.classList.add('correct'); score++;
                } else {
                    inputElement.classList.add('incorrect');
                    inputElement.value = `${userAnswer} (✗ ${correctAnswer})`;
                }
            }
            document.getElementById('tableScore').innerText = `得分： ${score} / 10`;
        }

        function resetTable() {
            for (let i = 0; i < wordList.length; i++) {
                const el = document.getElementById(`ans_${i}`);
                el.value = ''; el.classList.remove('correct', 'incorrect');
            }
            document.getElementById('tableScore').innerText = '';
        }

        // --- 畫布區塊 ---
        const textCanvas = document.getElementById('textCanvas');
        const textCtx = textCanvas.getContext('2d');
        const canvas = document.getElementById('dictationCanvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false, currentTool = 'blue'; 

        function setTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`tool-${tool}`).classList.add('active');
        }

        function initCanvasText(showAnswers = false) {
            textCtx.clearRect(0, 0, textCanvas.width, textCanvas.height);
            textCtx.font = '18px Comic Sans MS';
            let leftColX = 20, rightColX = 360; 

            for (let i = 0; i < 5; i++) {
                let y = 65 + (i * 80); 
                let wLeft = wordList[i], wRight = wordList[i+5];
                
                textCtx.fillStyle = '#333333';
                let qLeft = `${i+1}. ${wLeft.present} ➔ `;
                textCtx.fillText(qLeft, leftColX, y);
                if (showAnswers) { textCtx.fillStyle = '#e74c3c'; textCtx.fillText(` ( ${wLeft.perfect} )`, leftColX + textCtx.measureText(qLeft).width + 100, y); }
                
                textCtx.fillStyle = '#333333';
                let qRight = `${i+6}. ${wRight.present} ➔ `;
                textCtx.fillText(qRight, rightColX, y);
                if (showAnswers) { textCtx.fillStyle = '#e74c3c'; textCtx.fillText(` ( ${wRight.perfect} )`, rightColX + textCtx.measureText(qRight).width + 100, y); }
            }
        }

        function startPosition(e) { isDrawing = true; draw(e); }
        function endPosition() { isDrawing = false; ctx.beginPath(); }
        
        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            let clientX = e.clientX || (e.touches && e.touches[0].clientX);
            let clientY = e.clientY || (e.touches && e.touches[0].clientY);
            const x = (clientX - rect.left) * (canvas.width / rect.width);
            const y = (clientY - rect.top) * (canvas.height / rect.height);

            ctx.lineCap = 'round';
            if (currentTool === 'eraser') {
                ctx.globalCompositeOperation = 'destination-out';
                ctx.lineWidth = 25; ctx.strokeStyle = 'rgba(0,0,0,1)'; 
            } else {
                ctx.globalCompositeOperation = 'source-over';
                ctx.lineWidth = 5; // 加粗筆跡，增加 AI 辨識率
                ctx.strokeStyle = '#2980b9'; 
            }
            ctx.lineTo(x, y); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(x, y);
        }

        function clearDrawCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            document.getElementById('canvasResult').style.display = 'none';
            setTool('blue'); initCanvasText(false); 
        }

        // 核心 AI 分析與批改引擎 (包含斷字縫合與紅框繪製)
        function processAndScoreOCR(recognizedWordsArray, container, targetCtx) {
            let score = 0;
            let foundWords = [];
            let caseErrors = [];
            let missedWords = [];
            
            // 1. 清理並標記所有辨識到的單字 (修正常見 AI 視覺誤差)
            let processedWords = recognizedWordsArray.map(w => {
                let clean = w.text.trim();
                // 把常見的錯誤看錯的字換回來，避免冤枉學生
                clean = clean.replace(/1/g, 'l').replace(/0/g, 'o').replace(/5/g, 's');
                // 移除標點符號，但保留大小寫
                clean = clean.replace(/[^a-zA-Z]/g, ''); 
                
                let isIgnored = ignoreWordsList.includes(clean.toLowerCase());
                return {
                    originalBbox: w.bbox,
                    cleanText: clean,
                    used: isIgnored, // 如果是題目字，直接標記為已使用，不再處理
                    isIgnored: isIgnored
                };
            });

            // 2. 評分邏輯
            wordList.forEach(wordObj => {
                const target = wordObj.perfect;
                let matched = false;

                // 步驟 A: 先找「單獨完整寫對」的字
                for (let i = 0; i < processedWords.length; i++) {
                    if (processedWords[i].used || processedWords[i].cleanText.length === 0) continue;
                    
                    let text = processedWords[i].cleanText;
                    if (text === target) { // 完全正確
                        score++; foundWords.push(target);
                        processedWords[i].used = true; matched = true; break;
                    } else if (text.toLowerCase() === target.toLowerCase()) { // 大小寫錯誤
                        caseErrors.push(`<b>${text}</b> (應為 <b>${target}</b>)`);
                        processedWords[i].used = true; matched = true; break;
                    }
                }

                if (matched) return;

                // 步驟 B: 「斷字縫合技術」- 如果學生寫太開(ea ten)，把它們連起來看！
                for (let i = 0; i < processedWords.length - 1; i++) {
                    if (processedWords[i].used) continue;
                    
                    // 嘗試組合相鄰的 2 個或 3 個字 (例如 t a ken)
                    let w1 = processedWords[i].cleanText;
                    let w2 = processedWords[i+1] ? processedWords[i+1].cleanText : "";
                    let w3 = processedWords[i+2] ? processedWords[i+2].cleanText : "";
                    
                    let combo2 = w1 + w2;
                    let combo3 = w1 + w2 + w3;

                    if (combo2 === target || combo3 === target) {
                        score++; foundWords.push(target);
                        processedWords[i].used = true; processedWords[i+1].used = true;
                        if (combo3 === target) processedWords[i+2].used = true;
                        matched = true; break;
                    } else if (combo2.toLowerCase() === target.toLowerCase() || combo3.toLowerCase() === target.toLowerCase()) {
                        caseErrors.push(`大小寫錯誤，應為 <b>${target}</b>`);
                        processedWords[i].used = true; processedWords[i+1].used = true;
                        if (combo3.toLowerCase() === target.toLowerCase()) processedWords[i+2].used = true;
                        matched = true; break;
                    }
                }

                if (!matched) missedWords.push(target);
            });

            // 3. 繪製紅框 (只框出那些「沒被判定正確/大小寫」且「不是題目」的錯字)
            targetCtx.save();
            targetCtx.strokeStyle = '#e74c3c'; 
            targetCtx.lineWidth = 3;
            targetCtx.fillStyle = 'rgba(231, 76, 60, 0.15)';

            processedWords.forEach(w => {
                // 如果這個字沒被用來得分，也不是題目，且有一定長度(避免把小污點畫框)
                if (!w.used && !w.isIgnored && w.cleanText.length >= 1) {
                    targetCtx.strokeRect(w.originalBbox.x0 - 2, w.originalBbox.y0 - 2, (w.originalBbox.x1 - w.originalBbox.x0) + 4, (w.originalBbox.y1 - w.originalBbox.y0) + 4);
                    targetCtx.fillRect(w.originalBbox.x0 - 2, w.originalBbox.y0 - 2, (w.originalBbox.x1 - w.originalBbox.x0) + 4, (w.originalBbox.y1 - w.originalBbox.y0) + 4);
                }
            });
            targetCtx.restore();

            // 4. 顯示文字報告
            let feedbackHTML = `<h3>📝 AI 批改結果：</h3><p style="font-size: 1.2em;"><strong>🌟 得分： ${score} / 10</strong></p>`;
            if (foundWords.length > 0) feedbackHTML += `<p style="color: #27ae60;">✅ <b>完全正確：</b><br>${foundWords.join(', ')}</p>`;
            if (caseErrors.length > 0) feedbackHTML += `<p style="color: #d35400;">⚠️ <b>大小寫錯誤 (不給分)：</b><br>${caseErrors.join('<br>')}</p>`;
            if (missedWords.length > 0) feedbackHTML += `<p style="color: #c0392b;">❌ <b>未作答或拼錯的字：</b><br>${missedWords.join(', ')}</p>`;
            
            container.innerHTML = feedbackHTML;
        }

        async function checkCanvasOCR() {
            const resultBox = document.getElementById('canvasResult');
            const btn = document.getElementById('btnCanvasOCR');
            
            resultBox.style.display = 'block';
            resultBox.innerHTML = '<p class="loading">⏳ AI 正在使用斷字縫合技術閱讀你的筆跡...</p>';
            btn.disabled = true;

            try {
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = canvas.width; tempCanvas.height = canvas.height;
                const tempCtx = tempCanvas.getContext('2d');
                tempCtx.fillStyle = '#ffffff'; tempCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
                tempCtx.drawImage(canvas, 0, 0);

                const { data: { words } } = await Tesseract.recognize(tempCanvas.toDataURL("image/png"), 'eng');
                processAndScoreOCR(words, resultBox, ctx);
                initCanvasText(true);
            } catch (error) {
                resultBox.innerHTML = `<p style="color:red;">❌ 辨識錯誤：${error.message}</p>`;
            } finally { btn.disabled = false; }
        }

        canvas.addEventListener('mousedown', startPosition);
        canvas.addEventListener('mouseup', endPosition);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('touchstart', startPosition, {passive: false});
        canvas.addEventListener('touchend', endPosition);
        canvas.addEventListener('touchmove', draw, {passive: false});

        window.onload = () => { initTable(); initCanvasText(false); };
    </script>
</body>
</html>
